services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: football_tournament_db
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/football_tournament_db?schema=public
      JWT_EXPIRES_IN: 7d
      JWT_SECRET: dev-secret-key
      PORT: 4000
    ports:
      - "4000:4000"
    command: sh -c "npx prisma db push && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
