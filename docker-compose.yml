services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: football_tournament_db
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_tournament_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-init:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/football_tournament_db?schema=public
      JWT_EXPIRES_IN: 7d
      JWT_SECRET: dev-secret-key
      PORT: 4000
    command: sh -c "npx prisma db push && npx prisma db seed"
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/football_tournament_db?schema=public
      JWT_EXPIRES_IN: 7d
      JWT_SECRET: dev-secret-key
      PORT: 4000
    ports:
      - "4000:4000"
    command: node dist/index.js
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
